name: Deploy to OCI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests and build"
        required: false
        type: boolean
        default: false

env:
  NODE_ENV: test

jobs:
  static:
    if: github.event.inputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    if: github.event.inputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ghostmail/client exec playwright install --with-deps
          chromium firefox

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run:
          pnpm --filter @ghostmail/client exec playwright install-deps chromium
          firefox

      - name: Run tests
        run: pnpm test

  build-and-push:
    needs: [static, test]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.inputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build
        env:
          VITE_SMTP_HOST: smtp.ghostmail.dev
          VITE_SMTP_PORT: 587
          VITE_MAIL_DOMAIN: ghostmail.dev

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/client/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ghostmail-client:latest
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push SMTP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/smtp-server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ghostmail-smtp:latest
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [static, test, build-and-push]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.static.result == 'success' || needs.static.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    environment: Deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/ghostmail"

      - name: Create .env file on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            mkdir -p ~/ghostmail
            echo "MONGO_USER=${{ secrets.MONGO_USER }}" > ~/ghostmail/.env
            echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" >> ~/ghostmail/.env
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> ~/ghostmail/.env
            echo "GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}" >> ~/ghostmail/.env
            echo "OCI_USER=${{ secrets.OCI_USER }}" >> ~/ghostmail/.env

      - name: SSH into OCI and Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            mkdir -p ~/ghostmail
            cd ~/ghostmail
            # Log in to GHCR
            echo $GITHUB_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Pull latest images from GHCR
            docker compose -p ghostmail pull
            # Restart services
            docker compose -p ghostmail up -d --remove-orphans
            # Cleanup old images to save disk space
            docker image prune -f
